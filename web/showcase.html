<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科普闯关系统 · 设备预览</title>
<style>
/* 设备预览页：把真实的网页版放进几个手机/平板外框里，用于演示与截图。
   注意：这里是**预览外壳**，真正使用请直接打开 /app/（自适应，手机上也好看）。 */
* { box-sizing: border-box; }
body {
  margin: 0; background: #eef3f9; color: #35506e;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px; line-height: 1.75;
}
.stage { padding: 26px 22px 60px; }
.head { max-width: 1180px; margin: 0 auto 22px; }
.badge {
  display: inline-block; background: #4FC3F7; color: #fff;
  border-radius: 999px; padding: 3px 12px; font-size: 12px; margin-bottom: 8px;
}
h1 { font-size: 20px; margin: 0 0 6px; color: #1f3d5c; }
.head .tip {
  background: #fff; border-radius: 12px; padding: 14px 16px;
  box-shadow: 0 6px 18px rgba(31,61,92,.08); max-width: 780px;
}
.head code { background: #eaf1f8; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
.devices {
  display: flex; gap: 30px; align-items: flex-start; justify-content: center;
  flex-wrap: wrap; margin-top: 8px;
}
.device { text-align: center; }
.device .name { margin-top: 12px; font-size: 13px; color: #6b7a8d; }
.device .name b { color: #2b7cd3; font-size: 14px; }

/* 手机外框：内嵌 iframe，用 transform 缩放把 390px 宽的应用装进框里 */
.frame {
  position: relative; background: #1c2b3a; border-radius: 40px;
  box-shadow: 0 20px 46px rgba(20,50,80,.3); padding: 12px; overflow: hidden;
}
.frame .screen {
  position: relative; background: #fff; border-radius: 30px; overflow: hidden;
}
.frame iframe { border: 0; display: block; transform-origin: top left; }
.frame::after {           /* 顶部刘海 */
  content: ''; position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  width: 84px; height: 6px; border-radius: 999px; background: #0d1a26; z-index: 3;
}
/* 尺寸由内联样式给出（每个设备不同） */
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <span class="badge">设备预览</span>
    <h1>科普闯关系统 · 学生端</h1>
    <div class="tip">
      下面是同一套学生端界面在三种屏幕上的样子（真实页面，不是截图）。
      默认展示<b>小学低年级</b>：注意题目都是「月亮会自己发光吗」这类生活现象题，
      换成初中会自动变成「月相变化的主要成因」——题库按学段分开。
      <br><br>
      这个页面只是预览外壳；<b>日常使用请直接打开 <code>/app/</code></b>，它会自适应屏幕。
      如果是双击文件打开看到「要用服务端地址打开」的提示，说明打开方式不对，
      请看提示里的两步操作。
    </div>
  </div>
  <div class="devices" id="devices"></div>
</div>

<script>
/* 各设备的逻辑尺寸与缩放：页面按手机宽度渲染，再等比缩放进外框 */
var DEVICES = [
  { name: '手机 · 小屏', width: 320, height: 640, scale: 0.94, hint: 'iPhone SE 一类' },
  { name: '手机 · 标准', width: 390, height: 760, scale: 1.0, hint: '主流机型' },
  { name: '平板 · 竖屏', width: 600, height: 800, scale: 0.92, hint: 'iPad 一类' }
];

var host = document.getElementById('devices');
DEVICES.forEach(function (d) {
  var wrap = document.createElement('div');
  wrap.className = 'device';

  var frame = document.createElement('div');
  frame.className = 'frame';
  var screen = document.createElement('div');
  screen.className = 'screen';
  // 外框按缩放后的尺寸显示，内部 iframe 保持真实渲染宽度
  screen.style.width = Math.round(d.width * d.scale) + 'px';
  screen.style.height = Math.round(d.height * d.scale) + 'px';

  var frameEl = document.createElement('iframe');
  frameEl.src = './index.html';
  frameEl.width = d.width;
  frameEl.height = d.height;
  frameEl.style.width = d.width + 'px';
  frameEl.style.height = d.height + 'px';
  frameEl.style.transform = 'scale(' + d.scale + ')';
  frameEl.setAttribute('title', '科普闯关系统 ' + d.name);

  screen.appendChild(frameEl);
  frame.appendChild(screen);
  wrap.appendChild(frame);

  var label = document.createElement('div');
  label.className = 'name';
  label.innerHTML = '<b>' + d.name + '</b><br>' + d.width + '×' + d.height + ' · ' + d.hint;
  wrap.appendChild(label);

  host.appendChild(wrap);
});
</script>
</body>
</html>
